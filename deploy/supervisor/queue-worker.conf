; =============================================================================
; Supervisor — Laravel queue worker (broadcast + job antrean)
; project.md Prompt 10
; =============================================================================
; Instal:
;   sudo cp deploy/supervisor/queue-worker.conf /etc/supervisor/conf.d/simrs-queue.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status simrs-queue:*
;
; Antrean yang wajib dilayani:
;   default  — event broadcast AntreanDipanggil (papan antrean) dan
;              BroadcastNotificationCreated (toast lonceng di halaman pasien)
;   broadcast— cadangan bila sebuah event menyebut broadcastQueue() eksplisit
;
; Catatan: notifikasi channel `database` TIDAK melewati antrean (langsung
; tertulis ke tabel notifications), jadi badge lonceng tetap muncul walau
; worker sedang mati. Yang tertunda hanya pembaruan papan & toast.
;
; Jalankan `php artisan queue:restart` SETELAH `.env` berubah supaya worker
; memuat ulang konfigurasi pada proses berikutnya.
; =============================================================================

[program:simrs-queue]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/hyfee
command=php artisan queue:work --queue=default,broadcast --sleep=1 --tries=3 --timeout=60

user=www-data
; 2 proses cukup untuk menekan latensi push papan antrean tanpa berebut kunci.
numprocs=2

autostart=true
autorestart=true
startsecs=3
startretries=999

; Job broadcast harus selesai dulu sebelum proses dimatikan.
stopwaitsecs=60
stopasgroup=true
killasgroup=true

redirect_stderr=true
stdout_logfile=/var/www/hyfee/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
