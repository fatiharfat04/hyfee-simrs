; =============================================================================
; Supervisor — Laravel Reverb (server WebSocket papan antrean & toast pasien)
; project.md Prompt 10
; =============================================================================
; Instal:
;   sudo cp deploy/supervisor/reverb.conf /etc/supervisor/conf.d/simrs-reverb.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status simrs-reverb
;
; PENTING:
;   - Port 6001 hanya untuk localhost; port publik (443) dibuka oleh nginx
;     lewat proxy WebSocket (lihat DEPLOYMENT.md).
;   - Jalankan `php artisan reverb:restart` SETELAH `.env` berubah, karena
;     proses ini memuat konfigurasi saat start dan tidak membaca ulang .env.
; =============================================================================

[program:simrs-reverb]
process_name=%(program_name)s
directory=/var/www/hyfee
command=php artisan reverb:start --host=0.0.0.0 --port=6001

user=www-data
numprocs=1

; Reverb harus hidup terus — matikan proses hanya bila benar-benar gagal start.
autostart=true
autorestart=true
startsecs=5
startretries=999

; Beri waktu pesan yang sedang dikirim sebelum dipaksa mati.
stopwaitsecs=30
stopasgroup=true
killasgroup=true

redirect_stderr=true
stdout_logfile=/var/www/hyfee/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
